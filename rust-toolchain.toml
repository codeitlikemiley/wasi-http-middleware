[toolchain]
# 1.99.0 is the quality-gate compiler. Do not float `stable`.
# `package.rust-version` stays 1.94, which compiled wasip3 0.9.0.
# Rust 1.93 cannot be treated as sufficient for that crate.
channel = "1.99.0"
components = ["clippy", "rustfmt"]
targets = ["wasm32-wasip2"]
profile = "minimal"
