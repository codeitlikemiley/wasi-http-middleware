[graph]
all-features = true
targets = ["wasm32-wasip2"]

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Guest bindings are one `wit-bindgen` 0.62.0, shared by `wasip3` 0.9.0 and
# the component export macro. `multiple-versions` stays a warning so a future
# second generator is visible. It is not an allowance for two guest ABIs.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
