[compatibility]
# `rust` is the compiler in rust-toolchain.toml and CI. `rust_msrv` is
# package.rust-version. Do not float either to `stable`.
rust = "1.99.0"
rust_msrv = "1.94"
wasi_http = "0.3.0"
wasip3 = "0.9.0+wasi-0.3.0"
wit_bindgen = "0.62.0"
# wasm32-wasip2 adapter package emitted by wasip3 0.9 / Rust 1.99.
# These imports are the reactor adapter, not middleware policy capabilities.
wasi_p2_adapter = "0.2.12"
# Official spinframework/spin release. It serves wasi:http/handler@0.3.0
# and native dependencies.middleware. The July fork is not a host.
spin_release = "4.2.5"
spin_release_commit = "e09d7d5c69f8fef1ca23c80b879445692207801e"
# Guest SDK pin for tests and consumers that import spin-sdk. This workspace
# does not depend on the SDK crate.
spin_sdk = "7.0.0"
spin_sdk_repository = "https://github.com/codeitlikemiley/spin-rust-sdk"
spin_sdk_revision = "3cf30012b50a1afb750dac3d28aa6da4a32c3468"
wasmtime = "50.0.0"
wasm_tools = "1.253.0"
wac = "0.10.1"
cargo_fuzz = "0.13.2"
fuzz_rust = "nightly-2026-03-06"
cosign = "3.1.1"
oras = "1.3.2"
oha = "1.14.0"
leptos_wasi = "0.5.0-alpha.3"
wasi_authz = "0.1.0-alpha.3"

[sibling_browser]
wasm_bindgen = "0.2.126"
wasm_bindgen_wasi_fix = "0.2.123"

[release]
version = "0.2.0-alpha.3"
channel = "alpha"
stable_spin_required = false
publish = false
semver_baseline = "6977a75c4d2cb1558158341c109e419189dc2c52"
